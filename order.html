<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ยืนยันการสั่งซื้อ | My Lovely</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">My Lovely</a>
      <nav class="nav-links">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้าทั้งหมด</a>
      </nav>
    </div>
  </header>

  <section class="page-heading">
    <div class="container">
      <h1>ยืนยันการสั่งซื้อ</h1>
      <p class="section-subtitle">กรอกข้อมูลของคุณให้ครบ แล้วทีมเราจะติดต่อกลับไปเพื่อนัดจัดส่งตุ๊กตาตัวน้อยให้ถึงมือคุณ</p>
    </div>
  </section>

  <section>
    <div class="container">
      <form id="orderForm" class="form-card">

        <div class="form-group">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" placeholder="ชื่อ-นามสกุล" required>
        </div>

        <div class="form-group">
          <label for="contact">เบอร์โทร/Line</label>
          <input type="text" id="contact" name="contact" placeholder="เบอร์โทรศัพท์ หรือ Line ID" required>
        </div>

        <div class="form-group">
          <label for="items">รายการสินค้า</label>
          <input type="text" id="items" name="items" placeholder="เช่น Rabbit 40 ซม." required>
        </div>

        <div class="form-group">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="text" id="total" name="total" placeholder="เช่น 189" required>
        </div>

        <div class="form-group">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note" placeholder="ที่อยู่จัดส่ง หรือข้อความเพิ่มเติม (ถ้ามี)"></textarea>
        </div>

        <div class="form-submit">
          <button type="submit" class="btn btn-primary">ยืนยันสั่งซื้อ</button>
        </div>

      </form>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 My Lovely — ตุ๊กตาตัวน้อยที่กอดแล้วใจฟู</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
